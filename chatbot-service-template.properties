# Configuration Template for ChatbotAi service
# Copy this file to chatbot-service-local.properties and add your real API keys

server.port=8087
spring.ai.openai.api-key=
telegram.api.key=

# Disable Eureka registration due to Jersey dependency conflict
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# MCP Client (optionnel - désactivé pour l'instant)
#spring.ai.mcp.client.streamable-http.connections.mcprh.url=http://localhost:8989/mcp
spring.ai.mcp.client.enabled=false
