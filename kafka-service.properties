server.port=8086
spring.application.name=kafka-service
spring.kafka.bootstrap-servers=localhost:9092

# Original PageEvent bindings
spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T2
spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=T3
spring.cloud.stream.bindings.pageEventSupplier-out-0.producer.poller.fixed-delay=200
spring.cloud.stream.bindings.kStream-in-0.destination=T3
spring.cloud.stream.bindings.kStream-out-0.destination=T4

# E-commerce Event bindings
spring.cloud.stream.bindings.orderProducer-out-0.destination=orders
spring.cloud.stream.bindings.stockProducer-out-0.destination=stock-updates
spring.cloud.stream.bindings.customerProducer-out-0.destination=customer-events

spring.cloud.stream.bindings.orderConsumer-in-0.destination=orders
spring.cloud.stream.bindings.stockConsumer-in-0.destination=stock-updates
spring.cloud.stream.bindings.customerConsumer-in-0.destination=customer-events

# Function definitions
spring.cloud.function.definition=pageEventConsumer;pageEventSupplier;kStream;orderProducer;stockProducer;customerProducer;orderConsumer;stockConsumer;customerConsumer

# Kafka Streams configuration
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000
